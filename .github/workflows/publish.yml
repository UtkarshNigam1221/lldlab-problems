name: Publish problems

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, in commit order; a newer push waits instead of racing the index.
concurrency:
  group: publish-problems
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job can request an OIDC token, and the publish role only trusts main.
    permissions:
      contents: read
      id-token: write
    env:
      PROBLEMS_URL: ${{ vars.PROBLEMS_URL }}
      BUCKET: ${{ vars.PROBLEMS_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # No install scripts: this job can write to the problems bucket.
      - run: npm ci --ignore-scripts
      # Validates every problem (including permanent slugs against the live index), then compiles; no solutions in dist/.
      - run: npm run problems -- build --out dist --published "$PROBLEMS_URL/index.json"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PROBLEMS_PUBLISH_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Upload problem versions
        # Versions are content-hashed and never change, so existing keys are skipped by size and nothing is deleted.
        run: aws s3 sync dist/v "s3://$BUCKET/v" --size-only --content-type application/json --cache-control "public, max-age=31536000, immutable"
      - name: Upload the index last
        # Last, so the live index never points at a file that isn't uploaded yet.
        run: aws s3 cp dist/index.json "s3://$BUCKET/index.json" --content-type application/json --cache-control "public, max-age=60"
      - name: Check the live index
        # CloudFront may serve the previous index for up to 60 s (its max-age), so poll instead of busting the cache.
        run: |
          want=$(jq -S '.problems' dist/index.json)
          for i in $(seq 1 12); do
            live=$(curl -sf "$PROBLEMS_URL/index.json" | jq -S '.problems' || true)
            [ "$live" = "$want" ] && { echo "live index matches"; exit 0; }
            sleep 10
          done
          echo "live index doesn't match the build after 2 minutes"; exit 1
