name: Release lldlab-runner

on:
  push:
    tags: ['runner-v*']

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # A publishing job never restores a cache another run could have written.
          package-manager-cache: false
      # No install scripts: this job can publish to npm, so dependencies must not run code during install.
      - run: npm ci --ignore-scripts
      - name: Tag must match package.json version
        run: test "runner-v$(node -p "require('./packages/runner/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test --workspace packages/runner
      # Trusted Publishing needs npm >= 11.5; Node 22 ships npm 10.
      - run: npx -y npm@11 publish --provenance --access public --workspace packages/runner
