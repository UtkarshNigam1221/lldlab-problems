name: Release lldlab-yaegi-runtime

on:
  push:
    tags: ['yaegi-v*']

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: packages/yaegi-runtime/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag must match npm/package.json version
        run: test "yaegi-v$(node -p "require('./packages/yaegi-runtime/npm/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Go runtime tests
        working-directory: packages/yaegi-runtime
        run: go test ./...
      # build:yaegi only needs Go and cp; no npm install, so no dependency code runs in this job.
      - run: npm run build:yaegi
      - name: Package must contain the runtime
        working-directory: packages/yaegi-runtime/npm
        run: npm pack --dry-run 2>&1 | tee /dev/stderr | grep -q 'yaegi.wasm'
      # Trusted Publishing needs npm >= 11.5; Node 22 ships npm 10.
      - name: Publish
        working-directory: packages/yaegi-runtime/npm
        run: npx -y npm@11 publish --provenance --access public
